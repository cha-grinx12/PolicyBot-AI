    // Helper: Dynamic Tenant Name from Email Domain
    function getTenantNameFromEmail(email) {
      if (!email || typeof email !== 'string' || !email.includes('@')) {
        return "Your Company";
      }
      const domain = email.split('@')[1].toLowerCase().trim();
      if (!domain) return "Your Company";

      const domainMap = {
        'acmecorp.com': 'Acme Corp',
        'acme.com': 'Acme Corp',
        'globex.com': 'Globex Inc',
        'globexcorp.com': 'Globex Inc',
        'initech.com': 'Initech',
        'umbrella.com': 'Umbrella Corp',
        'wayne.com': 'Wayne Enterprises',
        'stark.com': 'Stark Industries',
        'hooli.com': 'Hooli'
      };

      if (domainMap[domain]) {
        return domainMap[domain];
      }

      const publicMailProviders = ['gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com', 'icloud.com', 'proton.me', 'protonmail.com', 'aol.com'];
      if (publicMailProviders.includes(domain)) {
        return 'Acme Corp';
      }

      const prefix = domain.split('.')[0] || '';
      if (!prefix) return "Your Company";

      if (prefix.toLowerCase().endsWith('corp')) {
        const main = prefix.slice(0, -4);
        return (main ? main.charAt(0).toUpperCase() + main.slice(1) + ' ' : '') + 'Corp';
      }
      if (prefix.toLowerCase().endsWith('inc')) {
        const main = prefix.slice(0, -3);
        return (main ? main.charAt(0).toUpperCase() + main.slice(1) + ' ' : '') + 'Inc';
      }

      return prefix
        .split(/[-_]/)
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Policy Category</label>
                      <select
                        value={pendingPdfModal.category}
                        onChange={e => setPendingPdfModal({ ...pendingPdfModal, category: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"
                      >
                        <option value="Time Off & Leave">Time Off & Leave</option>
                        <option value="Benefits & Health">Benefits & Health</option>
                        <option value="Compliance & Conduct">Compliance & Conduct</option>
                        <option value="Equipment & Security">Equipment & Security</option>
                        <option value="Perks & Compensation">Perks & Compensation</option>
                        <option value="General Policy">General Policy</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-400 uppercase mb-1">File Size</label>
                      <input
                        type="text"
                        disabled
                        value={pendingPdfModal.fileSize}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-slate-400 font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Extracted Policy Content / Clauses</label>
                    <textarea
                      rows={6}
                      value={pendingPdfModal.content}
                      onChange={e => setPendingPdfModal({ ...pendingPdfModal, content: e.target.value })}
                      className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 font-mono text-[11px] leading-relaxed focus:outline-none focus:border-cyan-500"
                    />
                    <p className="text-[10px] text-slate-400 mt-1">
                      PolicyBot AI automatically indexes these clauses for direct citation in employee answers.
                    </p>
                  </div>
                </div>

                <div className="flex justify-end space-x-2 pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setPendingPdfModal(null)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleConfirmIngestPdf}
                    className="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-xs font-bold shadow-md shadow-cyan-600/30 transition active:scale-95"
                  >
                    Index Policy PDF
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: MANUAL POLICY ENTRY */}
          {isManualModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveManualPolicy} className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white">Add Handbook Policy Clause</h3>
                  <button
                    type="button"
                    onClick={() => setIsManualModalOpen(false)}
                    className="text-slate-400 hover:text-white p-1 rounded-lg"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Document Filename</label>
                    <input
                      type="text"
                      placeholder="e.g. Parental_Leave_2026.pdf"
                      value={manualTitle}
                      onChange={e => setManualTitle(e.target.value)}
                      required
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Category</label>
                    <select
                      value={manualCategory}
                      onChange={e => setManualCategory(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"
                    >
                      <option value="Time Off & Leave">Time Off & Leave</option>
                      <option value="Benefits & Health">Benefits & Health</option>
                      <option value="Compliance & Conduct">Compliance & Conduct</option>
                      <option value="Equipment & Security">Equipment & Security</option>
                      <option value="Perks & Compensation">Perks & Compensation</option>
                      <option value="General Policy">General Policy</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Official Policy Clause</label>
                    <textarea
                      rows={5}
                      placeholder="Enter verified terms, requirements, numbers, and dates..."
                      value={manualContent}
                      onChange={e => setManualContent(e.target.value)}
                      required
                      className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono text-[11px] leading-relaxed"
                    />
                  </div>
                </div>

                <div className="flex justify-end space-x-2 pt-2 border-t border-slate-800">
                  <button
                    type="button"
                    onClick={() => setIsManualModalOpen(false)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-600/30"
                  >
                    Save & Index
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* CITATION DRAWER (SLIDES IN FROM THE RIGHT WITH DYNAMIC LEGAL CLAUSE HIGHLIGHTING) */}
          {viewingCitationModal && (() => {
            const displayTitle = viewingCitationModal.title || viewingCitationModal.policyTitle || 'Policy Document';
            const displayContent = viewingCitationModal.content || viewingCitationModal.snippet || 'No document content available.';
            const rawSearch = (citationDrawerSearch || citationQueryContext || "").trim().toLowerCase();
            const stopWords = new Set(['the', 'and', 'for', 'are', 'what', 'how', 'when', 'with', 'from', 'this', 'that', 'have', 'does', 'paano', 'saan', 'kailan']);
            const keywords = rawSearch
              .split(/[\s,?.!]+/)
              .filter(w => w.length >= 3 && !stopWords.has(w));

            const paragraphs = displayContent.split('\n');

            return (
              <div className="fixed inset-0 z-50 overflow-hidden flex justify-end bg-slate-950/70 backdrop-blur-xs">
                <div className="w-full sm:w-[480px] bg-slate-900 border-l border-slate-800 h-full flex flex-col shadow-2xl animate-in slide-in-from-right duration-200">
                  {/* Drawer Header */}
                  <div className="p-4 bg-slate-950/95 border-b border-slate-800 flex items-center justify-between">
                    <div className="flex items-center space-x-2 min-w-0">
                      <span className="text-xl">📄</span>
                      <div className="min-w-0">
                        <h3 className="text-sm font-bold text-white font-mono truncate">
                          [📄 {displayTitle}]
                        </h3>
                        <p className="text-[10px] text-slate-400">
                          Interactive Legal Citation & Clause Verification
                        </p>
                      </div>
                    </div>
                    <div className="flex items-center space-x-1.5 shrink-0">
                      <button
                        type="button"
                        id="btn-print-citation-doc"
                        onClick={() => handlePrintDocument({ title: displayTitle, content: displayContent, category: viewingCitationModal.category })}
                        className="flex items-center space-x-1 px-2.5 py-1 bg-slate-800 hover:bg-slate-750 text-slate-200 hover:text-white rounded-lg text-xs font-medium border border-slate-700 transition"
                        title="Print this cited policy"
                      >
                        <span>🖨️</span>
                        <span>Print</span>
                      </button>
                      <button
                        onClick={() => { setViewingCitationModal(null); setCitationDrawerSearch(""); }}
                        className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition"
                      >
                        ✕
                      </button>
                    </div>
                  </div>

                  {/* Metadata & Search bar */}
                  <div className="p-3 bg-slate-950/60 border-b border-slate-800 space-y-2">
                    <div className="flex items-center justify-between text-[11px] text-slate-400">
                      <span className="px-2 py-0.5 rounded bg-slate-800 text-indigo-300 font-medium">
                        {viewingCitationModal.category || "Verified Company Policy"}
                      </span>
                      <span className="text-emerald-400 flex items-center gap-1 font-mono text-[10px]">
                        <span>✓ 100% Grounded DOLE / Acme Source</span>
                      </span>
                    </div>

                    <div className="relative">
                      <input
                        type="text"
                        placeholder="Search clause or keywords in document..."
                        value={citationDrawerSearch}
                        onChange={e => setCitationDrawerSearch(e.target.value)}
                        className="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                      />
                      {citationDrawerSearch && (
                        <button
                          onClick={() => setCitationDrawerSearch("")}
                          className="absolute right-2 top-1.5 text-slate-400 hover:text-white text-xs"
                        >
                          ✕
                        </button>
                      )}
                    </div>
                  </div>

                  {/* Content with dynamic <mark> highlighting */}
                  <div className="flex-1 overflow-y-auto p-4 space-y-3 text-xs leading-relaxed text-slate-200 font-sans">
                    {paragraphs.map((para, pIdx) => {
                      if (!para.trim()) return <br key={pIdx} />;
                      const sentences = para.split(/(?<=[.!?])\s+/);

                      return (
                        <p key={pIdx} className="mb-3 last:mb-0">
                          {sentences.map((sentence, sIdx) => {
                            const lowerSentence = sentence.toLowerCase();
                            const hasMatch = keywords.length > 0 && keywords.some(kw => lowerSentence.includes(kw));

                            if (hasMatch) {
                              return (
                                <mark key={sIdx} className="bg-yellow-300/50 text-yellow-100 px-1 py-0.5 rounded font-medium transition-colors">
                                  {sentence}{' '}
                                </mark>
                              );
                            }
                            return <span key={sIdx}>{sentence} </span>;
                          })}
                        </p>
                      );
                    })}
                  </div>

                  {/* Drawer Footer */}
                  <div className="p-3 bg-slate-950 border-t border-slate-800 flex items-center justify-between text-xs">
                    <span className="text-[11px] text-slate-400">
                      Exact legal clauses highlighted above.
                    </span>
                    <button
                      onClick={() => { setViewingCitationModal(null); setCitationDrawerSearch(""); }}
                      className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition active:scale-95"
                    >
                      Close Drawer
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* MODAL: FULL DOCUMENT READER MODAL WITH INTERACTIVE PRINT */}
          {readerModalDoc && (() => {
            const docTitle = readerModalDoc.title || "Policy Document";
            const docContent = readerModalDoc.content || "No document content available.";
            const docCategory = readerModalDoc.category || "Verified Company Policy";
            const docFileSize = readerModalDoc.fileSize || "42 KB";
            const docUpdated = readerModalDoc.lastUpdated || "2026-01-10";

            return (
              <div
                id="document-reader-modal-overlay"
                className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-slate-950/80 backdrop-blur-sm"
                onClick={(e) => {
                  if (e.target === e.currentTarget) setReaderModalDoc(null);
                }}
              >
                <div
                  id="document-reader-modal"
                  className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-4xl h-[88vh] flex flex-col shadow-2xl overflow-hidden"
                >
                  {/* Top Header Bar */}
                  <div className="py-3 px-5 bg-slate-950/90 border-b border-slate-800 flex items-center justify-between shrink-0">
                    <div className="flex items-center space-x-3 min-w-0">
                      <div className="w-9 h-9 rounded-xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center text-indigo-400 shrink-0 text-base">
                        📄
                      </div>
                      <div className="min-w-0">
                        <div className="flex items-center space-x-2">
                          <h2 className="text-sm sm:text-base font-bold text-white truncate font-mono">
                            {docTitle}
                          </h2>
                          <span className="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                            ✓ Verified Grounding Source
                          </span>
                        </div>
                        <div className="flex items-center space-x-3 text-[11px] text-slate-400 mt-0.5">
                          <span>🏷️ {docCategory}</span>
                          <span className="text-slate-600">•</span>
                          <span>📅 Updated: {docUpdated}</span>
                          <span className="text-slate-600">•</span>
                          <span className="font-mono text-slate-400">{docFileSize}</span>
                        </div>
                      </div>
                    </div>

                    {/* Action Buttons */}
                    <div className="flex items-center space-x-2 shrink-0">
                      {/* Tab switchers */}
                      <div className="hidden sm:flex items-center bg-slate-800/80 p-0.5 rounded-lg border border-slate-700/60 text-xs mr-2">
                        <button
                          type="button"
                          onClick={() => setReaderModalTab("preview")}
                          className={`px-3 py-1 rounded-md font-medium transition ${
                            readerModalTab === "preview"
                              ? "bg-indigo-600 text-white shadow-sm"
                              : "text-slate-400 hover:text-white"
                          }`}
                        >
                          Document View
                        </button>
                        <button
                          type="button"
                          onClick={() => setReaderModalTab("text")}
                          className={`px-3 py-1 rounded-md font-medium transition ${
                            readerModalTab === "text"
                              ? "bg-indigo-600 text-white shadow-sm"
                              : "text-slate-400 hover:text-white"
                          }`}
                        >
                          Extracted Clauses
                        </button>
                      </div>

                      {/* Print Status Feedback */}
                      {printStatus && (
                        <span className="hidden md:inline-flex items-center text-[11px] font-medium text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2.5 py-1 rounded-lg animate-pulse">
                          ✓ {printStatus}
                        </span>
                      )}

                      {/* Functional Print Button */}
                      <button
                        type="button"
                        id="btn-print-doc"
                        onClick={() => handlePrintDocument(readerModalDoc)}
                        className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl border text-xs font-medium transition active:scale-95 ${
                          printStatus
                            ? "bg-emerald-600/30 border-emerald-500 text-emerald-300"
                            : "bg-slate-800 hover:bg-slate-750 text-slate-200 hover:text-white border-slate-700"
                        }`}
                        title="Print document (calls window.print())"
                      >
                        <span>🖨️</span>
                        <span className="hidden sm:inline">{printStatus ? "Printing..." : "Print"}</span>
                      </button>

                      {/* Close button */}
                      <button
                        type="button"
                        id="btn-close-reader-modal"
                        onClick={() => setReaderModalDoc(null)}
                        className="p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition"
                        title="Close reader (Esc)"
                      >
                        ✕
                      </button>
                    </div>
                  </div>

                  {/* Document Content View */}
                  <div className="flex-1 overflow-y-auto p-6 bg-slate-950/70">
                    <div
                      id="printable-document-content"
                      className="max-w-3xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-md text-slate-200 font-sans"
                    >
                      <div className="border-b border-slate-800 pb-4 mb-6">
                        <div className="flex items-center justify-between text-xs text-slate-400 font-mono mb-2">
                          <span>ACME CORP &bull; OFFICIAL COMPLIANCE ARCHIVE</span>
                          <span>TENANT ISOLATED: @ACMECORP.COM</span>
                        </div>
                        <h1 className="text-xl sm:text-2xl font-bold text-white font-mono">{docTitle}</h1>
                        <div className="flex items-center space-x-3 text-xs text-slate-400 mt-2">
                          <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-semibold">{docCategory}</span>
                          <span>&bull;</span>
                          <span>Published & Grounded for PolicyBot AI</span>
                        </div>
                      </div>

                      {readerModalTab === "preview" ? (
                        <div className="space-y-4 text-xs sm:text-sm leading-relaxed text-slate-300 whitespace-pre-wrap font-sans">
                          {docContent}
                        </div>
                      ) : (
                        <div className="space-y-3 font-mono text-xs">
                          <div className="text-slate-400 uppercase text-[10px] tracking-wider mb-2">Indexed Vector Chunks:</div>
                          {docContent.split('\n\n').filter(Boolean).map((chunk, idx) => (
                            <div key={idx} className="p-3.5 bg-slate-950 rounded-xl border border-slate-800 text-slate-300">
                              <span className="text-indigo-400 text-[10px] font-bold block mb-1">Clause Chunk #{idx + 1}:</span>
                              <p className="leading-relaxed">{chunk}</p>
                            </div>
                          ))}
                        </div>
                      )}

                      <div className="mt-8 pt-4 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-500 font-mono">
                        <span>DOLE Statutory Compliance & Internal Handbook v2.6</span>
                        <span>Acme Corp Human Resources Department</span>
                      </div>
                    </div>
                  </div>

                  {/* Modal Footer */}
                  <div className="py-2.5 px-5 bg-slate-950 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400 shrink-0">
                    <span className="text-[11px]">
                      Press <kbd className="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 text-[10px] font-mono">Esc</kbd> or click background to close.
                    </span>
                    <button
                      type="button"
                      onClick={() => setReaderModalDoc(null)}
                      className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold transition"
                    >
                      Done
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
